[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-profile-builder"
version = "0.1.0"
description = "Reviewed, explicit Hermes profile creation — scoping, design, interview, implementation, validation, rollback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prismatic7" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[project.entry-points."hermes_agent.plugins"]
profile-builder = "profile_builder"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_builder"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
package = true
